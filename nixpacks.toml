[phases.setup]
nixPkgs = ["nodejs-20_x", "pnpm", "ffmpeg", "python312Packages.pip", "python312Packages.numpy", "python312Packages.pillow", "python312Packages.opencv4"]

[phases.install]
cmds = [
    "pnpm install --frozen-lockfile",
    "pip install --break-system-packages edge-tts || true"
]

[phases.build]
cmds = ["pnpm build"]

[start]
cmd = "node apps/server/dist/index.js"
